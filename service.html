<body class="bg-gray-50">

<div class="bg-black text-white p-8">
<h1 id="h1" class="text-4xl font-black"></h1>
<p id="sub" class="mt-3 text-gray-300"></p>
<a href="tel:8796284796" class="mt-6 inline-block bg-green-500 text-black px-8 py-4 rounded-full font-black">CALL NOW 8796284796</a>
</div>

<div class="p-8 max-w-4xl mx-auto">

</div>

<a href="tel:8796284796" class="bg-black text-white px-10 py-4 rounded-full font-black text-xl inline-block">BOOK VISIT Rs 199</a>

</div>

<script>
const p = new URLSearchParams(location.search);
const areaRaw = p.get('area') || 'Indirapuram-201014';
const brandRaw = p.get('brand') || 'Hafele';

const areaName = areaRaw.split('-')[0];
const pincode = areaRaw.split('-').pop();

const landmarks = {
"Indirapuram-201014":"Shipra Suncity, ATS Village, Jaipuria Sunrise Greens, Indirapuram",
"Vaishali-201010":"Mahagun Mansion, Ramprastha Greens, Vaishali Sector 5",
"Vasundhara-201012":"East End Apartments, Vasundhara Sector 12, Ashoka Society",
"Kaushambi-201010":"Kaushambi Apartments, Yashoda Hospital, Kaushambi Metro",
"Raj-Nagar-Extension-201017":"Panchsheel Green, Charms Castle, VVIP Addresses",
"Crossing-Republik-201016":"Panchsheel Wellington, Supertech Crossing Republik",
"Sahibabad-201005":"Shyam Park Metro Station, Rajendra Nagar, Sahibabad",
"Shalimar-Garden-201005":"Shalimar Garden Extn 1, DLF Ankur Vihar",
"Kavi-Nagar-201002":"Kavi Nagar Police Chowki, Patel Nagar",
"Raj-Nagar-201002":"Raj Nagar District Center, Nandgram"
};

const finalTitle = `${brandRaw} Chimney Service in ${areaName} Ghaziabad Near Me Visit Rs 199`;

document.title = finalTitle + " | 8796284796";
document.getElementById('seo-title').innerText = finalTitle;
document.getElementById('seo-desc').setAttribute('content', `${finalTitle} - Near ${landmarks[areaRaw]}. 30 Min Service. Call 8796284796`);

document.getElementById('h1').innerText = finalTitle;
document.getElementById('sub').innerText = `Expert ${brandRaw} Chimney Repair in ${areaName} Ghaziabad - Near ${landmarks[areaRaw]} - Same Day Visit Rs 199`;
document.getElementById('area').innerText = areaName + " Ghaziabad";
document.getElementById('landmark').innerText = landmarks[areaRaw];
document.getElementById('landmark2').innerText = `We cover all societies near ${landmarks[areaRaw]}, ${areaName} Ghaziabad ${pincode}. Call for doorstep service.`;
</script>

</body>
</html>
